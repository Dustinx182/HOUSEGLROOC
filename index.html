<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>HOUSE — Guild League Report</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0f1115;
    --panel:#171a21;
    --panel-2:#1e222b;
    --border:#2a2f3a;
    --text:#e8e8ec;
    --text-dim:#8b8f9c;
    --gold:#d4a94c;
    --gold-dim:#8a7238;
    --win:#3fb87f;
    --loss:#e05c5c;
    --pass:#3fb87f;
    --fail:#e2645f;
    --dps:#5b9bd5;
    --support:#c98fd4;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{padding-bottom:48px;}

  .crest{
    display:flex; align-items:center; justify-content:center;
    width:34px;height:34px;border-radius:8px;
    background:linear-gradient(155deg,var(--gold),var(--gold-dim));
    color:#1b1508; font-weight:800; font-size:15px; flex-shrink:0;
  }

  header.top{
    position:sticky; top:0; z-index:50;
    background:rgba(15,17,21,0.92); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);
    padding:12px 16px;
    display:flex; align-items:center; gap:10px;
  }
  header.top .titles{flex:1; min-width:0;}
  header.top h1{font-size:15px; margin:0; letter-spacing:0.02em; font-weight:700;}
  header.top .sub{font-size:11px; color:var(--text-dim); margin-top:1px;}
  .record-pill{
    font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px;
    background:var(--panel-2); border:1px solid var(--border); white-space:nowrap;
  }

  main{max-width:720px; margin:0 auto; padding:14px 12px 0;}

  section{margin-bottom:22px;}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; margin:0 4px 10px; gap:8px; flex-wrap:wrap;}
  .section-head h2{font-size:13px; text-transform:uppercase; letter-spacing:0.08em; color:var(--text-dim); margin:0; font-weight:700;}
  .section-head.sh-record h2{color:var(--gold);}
  .section-head.sh-comp h2{color:#5ec8c0;}
  .section-head.sh-trends h2{color:var(--dps);}
  .section-head.sh-top h2{color:#e8a33d;}
  .section-head.sh-kpi h2{color:var(--support);}
  .info-link{
    background:none; border:none; color:var(--gold); font-size:11px; font-weight:600;
    cursor:pointer; padding:0; white-space:nowrap;
  }

  .kpi-info-panel{
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:12px 13px; margin-bottom:12px; font-size:11.5px; color:var(--text-dim); line-height:1.5;
  }
  .kpi-info-panel p{margin:0 0 10px;}
  .kpi-info-panel table{width:100%; border-collapse:collapse; font-size:11px;}
  .kpi-info-panel th{
    text-align:left; color:var(--text); font-weight:700; padding:5px 4px;
    border-bottom:1px solid var(--border); font-size:10px; text-transform:uppercase; letter-spacing:0.03em;
  }
  .kpi-info-panel td{padding:6px 4px; border-bottom:1px solid rgba(255,255,255,0.04); color:var(--text);}
  .kpi-info-panel td:first-child{color:var(--text-dim); font-weight:600;}
  .kpi-info-panel .ceil-note{color:var(--fail); font-size:9.5px;}
  .kpi-info-panel .bi-short{color:var(--fail); font-weight:700; background:rgba(224,92,92,0.1);}
  .kpi-info-panel .bi-ok{color:var(--win); font-weight:700; background:rgba(63,184,127,0.1);}
  .kpi-info-panel .bi-na{color:var(--text-dim);}
  .kpi-info-panel .bi-short-dot{color:var(--fail);}
  .kpi-info-panel .bi-ok-dot{color:var(--win);}
  .kpi-info-panel .ip-title{font-size:12.5px; font-weight:800; display:block; margin-bottom:2px;}
  .kpi-info-panel .ip-gold{color:var(--gold);}
  .kpi-info-panel .ip-win{color:var(--win);}
  .kpi-info-panel .ip-teal{color:#5ec8c0;}
  .kpi-info-panel .ip-blue{color:var(--dps);}
  .kpi-info-panel .ip-purple{color:var(--support);}

  .sticky-filters{
    position:sticky; top:112px; z-index:40;
    background:rgba(15,17,21,0.96); backdrop-filter:blur(6px);
    padding:8px 2px 10px; margin:0 -2px 4px;
    border-bottom:1px solid var(--border);
  }

  /* global battlefield toggle — sits between the header and <main>, so position:sticky pins it
     for the ENTIRE page scroll (its containing block is unbounded), not just within one section.
     top-offset value is measured against the real rendered header height, not guessed. */
  .global-toggle-bar{
    position:sticky; top:59px; z-index:45;
    background:rgba(15,17,21,0.96); backdrop-filter:blur(6px);
    padding:8px 12px; border-bottom:1px solid var(--border);
  }
  .global-toggle-bar .toggle-group{max-width:720px; margin:0 auto;}
  @media (min-width:860px){ .global-toggle-bar .toggle-group{max-width:1180px;} }

  .player-group-head{
    display:flex; align-items:center; gap:8px; margin:14px 4px 6px;
  }
  .player-group-head .pg-name{font-weight:700; font-size:13.5px; flex:0 1 auto; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .player-group-head .job-badge{margin-right:auto;}
  .player-group-head .pg-count{font-size:10px; color:var(--text-dim); white-space:nowrap;}
  .player-group-head .pg-rate{
    font-size:10px; font-weight:800; padding:2px 7px; border-radius:6px; white-space:nowrap;
  }
  .player-group-head .pg-rate.good{background:rgba(63,184,127,0.18); color:var(--win);}
  .player-group-head .pg-rate.bad{background:rgba(224,92,92,0.18); color:var(--loss);}
  .player-group{margin-bottom:4px;}
  .player-group .player-card{margin-bottom:6px; margin-left:6px;}

  /* battlefield toggle */
  .toggle-group{display:flex; background:var(--panel-2); border:1px solid var(--border); border-radius:9px; padding:3px; gap:3px;}
  .toggle-group button{
    flex:1; border:none; background:transparent; color:var(--text-dim);
    padding:7px 0; font-size:12.5px; font-weight:600; border-radius:6px; cursor:pointer;
  }
  .toggle-group button.active{background:var(--gold); color:#1b1508;}

  /* match pills */
  .match-strip{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 4px;}
  .match-card{
    flex:0 0 auto; min-width:108px; background:var(--panel); border:1px solid var(--border);
    border-radius:10px; padding:9px 11px; position:relative; cursor:pointer;
    transition:border-color 0.15s, background 0.15s;
  }
  .match-card:active{transform:scale(0.97);}
  .match-card.is-newest{border-color:var(--dps); background:rgba(91,155,213,0.10);}
  .match-card.selected{border-color:var(--gold); background:rgba(212,169,76,0.10);}
  .match-card .m{font-size:10px; color:var(--text-dim); font-weight:600;}
  .age-tag{
    position:absolute; top:-7px; left:9px; font-size:8px; font-weight:800; padding:2px 6px;
    border-radius:5px; text-transform:uppercase; letter-spacing:0.02em; border:1px solid var(--bg);
  }
  .age-tag.newest{background:var(--dps); color:#0f1115;}
  .age-tag.oldest{background:var(--panel-2); color:var(--text-dim); border-color:var(--border);}
  .match-card .opp{font-size:12.5px; font-weight:700; margin-top:1px;}
  .match-card .res{
    position:absolute; top:8px; right:9px; font-size:9px; font-weight:800; padding:2px 6px; border-radius:5px;
  }
  .res.Win{background:rgba(63,184,127,0.18); color:var(--win);}
  .res.Loss{background:rgba(224,92,92,0.18); color:var(--loss);}
  .match-card .kd{font-size:11px; color:var(--text-dim); margin-top:6px;}
  .match-card .kd b{color:var(--text);}
  .match-card .tap-hint{font-size:8.5px; color:var(--gold-dim); margin-top:5px; font-weight:700; letter-spacing:0.02em;}

  /* chart panel */
  .chart-panel{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px 10px 6px;}
  .chart-grid{display:flex; flex-direction:column; gap:10px;}
  .chart-panel canvas{max-height:220px;}

  /* leaderboard */
  .lb-sub-note{font-size:10.5px; color:var(--text-dim); margin:0 4px;}
  .lb-grid{display:flex; flex-direction:column; gap:10px;}
  .lb-panel{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px 14px;}
  .lb-panel .lb-title{font-size:11px; font-weight:800; color:var(--gold); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:8px;}
  .lb-row{display:flex; align-items:center; gap:9px; padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.04);}
  .lb-row:last-child{border-bottom:none;}
  .lb-rank{width:22px; height:22px; border-radius:6px; display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:800; flex-shrink:0; background:var(--panel-2); color:var(--text-dim);}
  .lb-rank.r1{background:rgba(212,169,76,0.22); color:var(--gold);}
  .lb-rank.r2{background:rgba(200,204,214,0.16); color:#c9cdd6;}
  .lb-rank.r3{background:rgba(198,131,74,0.22); color:#c9834a;}
  .lb-info{flex:1; min-width:0;}
  .lb-name{font-size:12.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .lb-meta{font-size:9.5px; color:var(--text-dim); margin-top:1px;}
  .lb-value{font-size:14px; font-weight:800; color:var(--text); white-space:nowrap; flex-shrink:0;}
  .lb-empty{font-size:11px; color:var(--text-dim); padding:4px 0 2px;}
  .lb-extra{border-top:1px dashed rgba(255,255,255,0.08); margin-top:2px; padding-top:2px;}
  .lb-toggle{
    display:block; width:100%; background:none; border:none; color:var(--gold); font-size:11px;
    font-weight:700; padding:8px 0 2px; margin-top:2px; cursor:pointer; text-align:center;
  }
  .lb-toggle:active{opacity:0.65;}

  /* team composition */
  .comp-row{margin-bottom:12px; border-radius:8px; padding:6px 8px; margin-left:-8px; margin-right:-8px;
    border-left:4px solid transparent;}
  .comp-row.opp-lead{background:rgba(224,92,92,0.18); border-left-color:var(--loss); padding-left:12px;}
  .comp-row.opp-lead .comp-head .job{color:var(--loss); font-weight:800;}
  .comp-row.opp-lead .comp-head .counts b.opp-num{color:var(--loss);}
  .comp-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; font-size:11.5px;}
  .comp-head .job{font-weight:700; color:var(--text);}
  .comp-head .counts{color:var(--text-dim); font-size:10.5px;}
  .comp-head .counts b{color:var(--text);}
  .comp-bar{display:flex; height:14px; border-radius:7px; overflow:hidden; background:var(--panel-2);}
  .comp-bar .house{background:var(--gold); min-width:0;}
  .comp-bar .opp{background:var(--loss); min-width:0;}
  .comp-bar .empty-both{flex:1; display:flex; align-items:center; justify-content:center;
    font-size:9px; color:var(--text-dim);}
  .comp-legend{display:flex; gap:14px; font-size:10.5px; color:var(--text-dim); margin-bottom:14px;}
  .comp-legend span{display:flex; align-items:center; gap:5px;}
  .comp-legend .dot{width:9px; height:9px; border-radius:3px; display:inline-block;}
  .comp-legend .dot.house{background:var(--gold);}
  .comp-legend .dot.opp{background:var(--loss);}

  /* filter bar */
  .filter-bar{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
  .filter-bar #sortFilter{flex:1.4;}
  select, input[type="search"]{
    background:var(--panel-2); color:var(--text); border:1px solid var(--border);
    border-radius:8px; padding:7px 10px; font-size:12.5px; flex:1; min-width:90px;
  }
  select:focus, input:focus{outline:1px solid var(--gold);}

  .kpi-summary{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--panel-2); border:1px solid var(--border); border-radius:9px;
    padding:9px 12px; margin-bottom:10px; font-size:12px; color:var(--text-dim);
  }
  .kpi-summary b{color:var(--gold); font-size:14px;}

  /* player card */
  .player-card{
    background:var(--panel); border:1px solid var(--border); border-radius:11px;
    padding:11px 12px; margin-bottom:8px;
  }
  .pc-top{display:flex; align-items:center; gap:8px; margin-bottom:9px;}
  .pc-name{font-weight:700; font-size:13.5px; flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .pc-top .job-badge{margin-right:auto;}
  .job-badge{
    font-size:9.5px; font-weight:700; padding:3px 7px; border-radius:6px; white-space:nowrap;
  }
  .job-badge.DPS{background:rgba(91,155,213,0.16); color:var(--dps);}
  .job-badge.Support{background:rgba(201,143,212,0.16); color:var(--support);}
  .match-tag{font-size:10px; color:var(--text-dim); white-space:nowrap;}
  .fail-badge{
    font-size:10px; font-weight:800; padding:3px 7px; border-radius:6px; white-space:nowrap;
  }
  .fail-badge.ok{background:rgba(63,184,127,0.18); color:var(--win);}
  .fail-badge.bad{background:rgba(224,92,92,0.18); color:var(--loss);}

  .metric-row{display:grid; grid-template-columns:repeat(4,1fr); gap:6px;}
  .metric{
    background:var(--panel-2); border-radius:8px; padding:6px 4px; text-align:center;
    border:1px solid transparent;
  }
  .metric.pass{border-color:rgba(63,184,127,0.35);}
  .metric.fail{border-color:rgba(224,92,92,0.45); background:rgba(224,92,92,0.08);}
  .metric.na{opacity:0.35;}
  .metric .mv{font-size:13px; font-weight:800;}
  .metric.pass .mv{color:var(--pass);}
  .metric.fail .mv{color:var(--fail);}
  .metric .mt{font-size:8.5px; color:var(--text-dim); margin-top:1px; text-transform:uppercase; letter-spacing:0.03em;}
  .metric .mtag{font-size:8.5px; color:var(--gold-dim); margin-top:1px; font-weight:700; letter-spacing:0.02em;}
  .metric .mtag-match{font-size:8.5px; color:var(--dps); margin-top:1px; font-weight:700; letter-spacing:0.02em;}

  .empty-msg{text-align:center; color:var(--text-dim); font-size:12.5px; padding:24px 10px;}

  .setup-card{
    max-width:520px; margin:40px auto; background:var(--panel); border:1px solid var(--border);
    border-radius:14px; padding:24px 20px; text-align:left;
  }
  .setup-icon{font-size:26px; margin-bottom:8px;}
  .setup-card h2{font-size:16px; margin:0 0 8px;}
  .setup-card p{font-size:12.5px; color:var(--text-dim); line-height:1.5; margin:0 0 12px;}
  .setup-card ol{font-size:12px; color:var(--text-dim); line-height:1.8; padding-left:18px; margin:0;}
  .setup-card code{background:var(--panel-2); padding:1px 5px; border-radius:4px; color:var(--gold); font-size:11px;}

  footer{text-align:center; color:var(--text-dim); font-size:10.5px; padding:18px 12px 4px;}

  /* ---------- wide-screen layout (desktop / tablet) ---------- */
  @media (min-width: 860px){
    main{max-width:1180px;}
    .chart-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:start;}
    .chart-full{grid-column:1 / -1;}
    .chart-panel canvas{max-height:260px;}
    .lb-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
    #compGrid{display:grid; grid-template-columns:1fr 1fr; gap:0 24px; align-content:start;}
  }
</style>
</head>
<body>

<header class="top">
  <div class="crest">H</div>
  <div class="titles">
    <h1>HOUSE — Guild League</h1>
    <div class="sub" id="headerSub">Stellar Clash</div>
  </div>
  <div class="record-pill" id="recordPill">–</div>
</header>

<div class="global-toggle-bar">
  <div class="toggle-group" id="trendBfToggle">
    <button data-bf="Sub">Sub-Battlefield</button>
    <button data-bf="Main" class="active">Main Battlefield</button>
  </div>
</div>

<main id="appBody">

  <section>
    <div class="section-head sh-record"><h2>Match Record</h2></div>
    <div class="match-strip" id="matchStrip"></div>
  </section>

  <section>
    <div class="section-head sh-comp"><h2>Team Composition</h2></div>
    <div style="height:10px;"></div>
    <select id="compMatchFilter" style="width:100%; margin-bottom:12px;"></select>
    <div id="compGrid"></div>
  </section>

  <section>
    <div class="section-head sh-trends"><h2>Team Trends</h2></div>
    <div style="height:12px;"></div>
    <div class="chart-grid">
      <div class="chart-panel">
        <canvas id="kdChart"></canvas>
      </div>
      <div class="chart-panel">
        <canvas id="aChart"></canvas>
      </div>
      <div class="chart-panel chart-full">
        <canvas id="objChart"></canvas>
      </div>
    </div>
  </section>

  <section>
    <div class="section-head sh-top"><h2>Top Performers</h2></div>
    <div style="height:12px;"></div>
    <div class="lb-grid" id="lbGrid"></div>
  </section>

  <section>
    <div class="section-head sh-kpi">
      <h2>Player KPI Check</h2>
      <button id="kpiInfoToggle" class="info-link">ℹ️ How is this calculated?</button>
    </div>
    <div id="kpiInfoPanel" class="kpi-info-panel" style="display:none;"></div>
    <div class="sticky-filters">
      <div class="filter-bar">
        <select id="matchFilter"></select>
        <select id="jobFilter"></select>
        <select id="sortFilter">
          <option value="fail">Most red first</option>
          <option value="pass">Most green first</option>
          <option value="name">Name A–Z</option>
        </select>
      </div>
      <input type="search" id="searchBox" placeholder="Search player name…" style="width:100%; margin-bottom:10px;">
      <div class="kpi-summary">
        <span>Players shown: <b id="shownCount">0</b></span>
        <span>Passed all KPI: <b id="passAllCount">0</b></span>
      </div>
    </div>
    <div id="playerList"></div>
  </section>

</main>

<footer>Based on median performance of winning rosters · KPI thresholds are guild-internal targets</footer>

<script>

// ---------- KPI thresholds ----------
// Roster-balanced median: each winning roster's own median counts equally, so no single
// roster (even a blowout win) can dominate a job's target just by fielding more of that job.
// mon/tab/kills/assists are floors (>=); death is a ceiling (<=), set at the 75th percentile
// of roster medians so it only flags genuinely bad play, not typical variance.
// Numbers below match HOUSE_KPI_Derivation.xlsx (Step 4, both tabs) exactly — that workbook
// is the auditable source of truth; this object is a copy of its published output.
const KPI = {
  Sub: {
    'Sniper/Stalker/GS': {mon:3,   k:30, a:123, d:15},
    'Doram':              {mon:5,   k:10, a:172, d:3},

    'Doram':              {mon:12,  k:8,  a:170, d:1},
    'Mage':                {mon:11,  k:13, a:151, d:5},
    'LK/Paladin':          {mon:12,  k:13, a:137, d:5},

    'Bard/Gypsy':          {mon:13,  k:null, a:110, d:1},
    'Priest':              {mon:12,  k:null, a:99,  d:1},
  }
};
const METRIC_LABEL = {Sub:'Mon', Main:'Tab'};

// ---------- HOUSE's own baseline (median of HOUSE's own per-match medians, all matches, win+loss) ----------
// Pulled from HOUSE_KPI_Derivation.xlsx Step 6c — same rigor as the KPI table above, kept in sync by hand
// whenever that workbook's Step 6 is recalculated.
const HOUSE_BASELINE = {
  Sub: {
    'Sniper/Stalker/GS': {mon:4, k:17, a:89,  d:17},
    'Doram':              {mon:3, k:9,  a:129, d:3},
    'Mage':                {mon:2, k:13, a:103, d:6},
    'LK/Paladin':          {mon:5, k:10, a:81,  d:7},
    'Biochemist':          {mon:0, k:null, a:129, d:6},
    'Bard/Gypsy':          {mon:null, k:null, a:67, d:3},
    'Priest':              {mon:null, k:null, a:79, d:2},
  },
  Main: {
    'Sniper/Stalker/GS': {mon:6, k:20, a:69,  d:24},
    'Doram':              {mon:9, k:6,  a:85,  d:3},
    'Mage':                {mon:8, k:6,  a:82,  d:4},
    'LK/Paladin':          {mon:7, k:15, a:72,  d:9},
    'Biochemist':          {mon:10, k:null, a:109, d:4},
    'Bard/Gypsy':          {mon:9, k:null, a:69, d:1},
    'Priest':              {mon:9, k:null, a:55, d:0},
  }
};


// ---------- per-match, per-job medians ----------
// Recomputed live from whatever data is loaded, unlike KPI/HOUSE_BASELINE which are hardcoded.
// Keyed "bf|match|kpiJob", pooled across BOTH rosters — this is "everyone playing my job on the
// field this match", not "my guild only". Requires MIN_MATCH_MEDIAN_N players sharing the job:
// with 1 or 2, a player would be compared largely to themselves, which isn't a real comparison.
const MIN_MATCH_MEDIAN_N = 3;
// The match-median table in the info panel tints each cell against the KPI target (red = that whole
// job group missed the target this match, green = it cleared). Set to false for plain neutral text.
const COLOR_MATCH_MEDIAN_TABLE = false;
let MATCH_MEDIANS = {};

function median(nums){
  if(!nums.length) return null;
  const s = [...nums].sort((a,b)=>a-b);
  const mid = s.length >> 1;
  return s.length % 2 ? s[mid] : (s[mid-1] + s[mid]) / 2;
}

function buildMatchMedians(){
  MATCH_MEDIANS = {};
  const buckets = {};
  // Both rosters. DASH.opponents holds enemy stat lines used ONLY here — they never appear as
  // cards, never enter the totals, never reach the filters. Everything else still reads DASH.players.
  const pool = DASH.players.concat(DASH.opponents || []);
  pool.forEach(p=>{
    // same non-participation filter the player list uses — a 0/0/0/0 line is an unplayed
    // roster slot, and including it would drag the group's median down artificially
    if((p.k + p.a + p.d + (p.mon||0) + (p.tab||0)) <= 0) return;
    const key = `${p.bf}|${p.match}|${p.kpiJob}`;
    (buckets[key] = buckets[key] || []).push(p);
  });
  Object.entries(buckets).forEach(([key, group])=>{
    if(group.length < MIN_MATCH_MEDIAN_N) return;
    const bf = key.split('|')[0];
    // An even-sized group yields a .5 median. Round it here rather than at display time, so the
    // table, the blue chip tags and the better/at/worse comparison all read from one identical
    // integer — rounding only the display would let a chip say "better than 5.5" beside a table
    // cell reading 6, or call a player with exactly 6 "better than match median (6)".
    const r = v => v===null ? null : Math.round(v);
    MATCH_MEDIANS[key] = {
      n:   group.length,
      mon: r(median(group.map(p=> bf==='Sub' ? (p.mon||0) : (p.tab||0)))),
      k:   r(median(group.map(p=>p.k))),
      a:   r(median(group.map(p=>p.a))),
      d:   r(median(group.map(p=>p.d))),
    };
  });
}

function evalPlayer(p){
  const kpi = KPI[p.bf][p.kpiJob];
  if(!kpi) return {checks:[], fails:0, applicable:0};
  const baseline = HOUSE_BASELINE[p.bf][p.kpiJob] || {};
  const monVal = p.bf==='Sub' ? p.mon : p.tab;
  // vsMedian: qualitative, not just numeric direction — "better" always means favorable relative to HOUSE's own
  // typical output for this job/metric, so it correctly flips for Death (a ceiling, where LOWER is better) instead
  // of literally reporting "above/below", which would say "above HOUSE median" for a worse (higher) death count.
  const vsMedian = (val, base, ceil) => {
    if(base===undefined || base===null) return null;
    if(val === base) return 'at';
    const better = ceil ? val < base : val > base;
    return better ? 'better' : 'worse';
  };
  // third tier: this player's own teammates in the same job, same match. Absent when too few shared it.
  const mm = MATCH_MEDIANS[`${p.bf}|${p.match}|${p.kpiJob}`] || {};
  const checks = [
    {label:METRIC_LABEL[p.bf], val:monVal, target:kpi.mon, pass: kpi.mon===null? null : monVal>=kpi.mon, ceil:false,
     vsMedian: vsMedian(monVal, baseline.mon, false), baseVal: baseline.mon,
     vsMatch: vsMedian(monVal, mm.mon, false), matchVal_: mm.mon},
    {label:'Kills', val:p.k, target:kpi.k, pass: kpi.k===null? null : p.k>=kpi.k, ceil:false,
     vsMedian: vsMedian(p.k, baseline.k, false), baseVal: baseline.k,
     vsMatch: vsMedian(p.k, mm.k, false), matchVal_: mm.k},
    {label:'Assist', val:p.a, target:kpi.a, pass: kpi.a===null? null : p.a>=kpi.a, ceil:false,
     vsMedian: vsMedian(p.a, baseline.a, false), baseVal: baseline.a,
     vsMatch: vsMedian(p.a, mm.a, false), matchVal_: mm.a},
    {label:'Death', val:p.d, target:kpi.d, pass: kpi.d===null? null : p.d<=kpi.d, ceil:true,
     vsMedian: vsMedian(p.d, baseline.d, true), baseVal: baseline.d,
     vsMatch: vsMedian(p.d, mm.d, true), matchVal_: mm.d},
  ];
  // passFinal is what actually colours the chip and counts toward GREEN/RED — pass (the raw league-target
  // check) is kept alongside it for the tag text, but is no longer the only way to go green. A chip that
  // misses the league target still turns green if it clears BOTH other tiers (HOUSE median and match median,
  // ties counting as clearing). Missing data is never counted in the player's favour: if either of those two
  // tiers has nothing to compare against, that path is simply unavailable and the chip stays on pass alone.
  checks.forEach(c=>{
    if(c.pass===null){ c.passFinal=null; return; }
    if(c.pass===true){ c.passFinal=true; return; }
    const clearsHouse = c.vsMedian==='better' || c.vsMedian==='at';
    const clearsMatch = c.vsMatch==='better' || c.vsMatch==='at';
    c.passFinal = clearsHouse && clearsMatch;
  });
  const applicableChecks = checks.filter(c=>c.passFinal!==null);
  const fails = applicableChecks.filter(c=>c.passFinal===false).length;
  return {checks, fails, applicable:applicableChecks.length};
}

// Single shared state for the Sub/Main toggle. Trends, Top Performers, and Player KPI Check all
// read from this one variable — three toggle controls stay in the UI (one per section, so you
// don't have to scroll back up to switch), but clicking any of them moves all three sections
// together, so it's never possible to have two sections silently showing different battlefields.
let currentBf = 'Main';

// ---------- match strip ----------
function renderMatchStrip(){
  const wins = DASH.matches.filter(m=>m.result==='Win').length;
  document.getElementById('recordPill').textContent = `${wins}W – ${DASH.matches.length-wins}L`;
  document.getElementById('headerSub').textContent = `Stellar Clash · ${DASH.matches.length} match${DASH.matches.length===1?'':'es'}`;
  document.getElementById('matchStrip').innerHTML = DASH.matches.map((m,i)=>{
    const sk=m.sub.k, sd=m.sub.d, mk=m.main.k, md=m.main.d;
    const isNewest = i===DASH.matches.length-1;
    const isOldest = i===0 && DASH.matches.length>1; // no point tagging "oldest" when there's only one match
    const tag = isNewest ? '<span class="age-tag newest">Newest</span>'
              : isOldest ? '<span class="age-tag oldest">Oldest</span>' : '';
    return `<div class="match-card${isNewest?' is-newest':''}" data-match="${m.match}">
      ${tag}
      <span class="res ${m.result}">${m.result}</span>
      <div class="m">Match ${m.match}</div>
      <div class="opp">vs ${m.opp}</div>
      <div class="kd">Sub <b>${sk}</b>/${sd}</div>
      <div class="kd">Main <b>${mk}</b>/${md}</div>
      <div class="tap-hint">Tap to focus ↴</div>
    </div>`;
  }).join('');
  // wired once — DASH.matches never changes after load, so the strip never re-renders
  document.querySelectorAll('#matchStrip .match-card').forEach(card=>{
    card.addEventListener('click', ()=> jumpToMatch(parseInt(card.dataset.match, 10)));
  });
}

// Clicking a match card is the one action that focuses BOTH Team Composition and Player KPI
// Check on that match at once — previously each had its own dropdown, so comparing the same
// match across both sections meant setting it twice. Changing either dropdown independently
// still works exactly as before and only affects its own section.
function jumpToMatch(matchNo){
  document.querySelectorAll('#matchStrip .match-card').forEach(card=>{
    card.classList.toggle('selected', parseInt(card.dataset.match,10)===matchNo);
  });
  const compSel = document.getElementById('compMatchFilter');
  compSel.value = String(matchNo);
  renderComposition();
  const kpiSel = document.getElementById('matchFilter');
  kpiSel.value = String(matchNo);
  renderPlayerList();
  if(document.getElementById('kpiInfoPanel').style.display !== 'none') renderKpiInfoPanel();
}

// ---------- KPI filters ----------
function populateFilters(){
  const matchSel = document.getElementById('matchFilter');
  matchSel.innerHTML = '<option value="all">All matches</option>' +
    DASH.matches.map(m=>`<option value="${m.match}">M${m.match} vs ${m.opp} (${m.result})</option>`).join('');

  const jobs = [...new Set(DASH.players.map(p=>p.kpiJob))];
  const jobSel = document.getElementById('jobFilter');
  jobSel.innerHTML = '<option value="all">All jobs</option>' +
    jobs.map(j=>`<option value="${j}">${j}</option>`).join('');

function renderMetricChips(ev){
  return ev.checks.map(c=>{
    if(c.passFinal===null) return `<div class="metric na"><div class="mv">${c.val ?? '—'}</div><div class="mt">${c.label}</div></div>`;
    // both tags stay silent when the comparison is unfavorable — they exist to add favorable or
    // neutral context, so a chip that already reads red doesn't get piled onto a second and third time
    const fmt = v => Math.round(v*10)/10;
    const tagFor = (dir, val, label, cls) => {
      if(dir===null || dir===undefined || dir==='worse') return '';
      const word = dir==='at' ? `at ${label}` : `better than ${label}`;
      return `<div class="${cls}">${word} (${fmt(val)})</div>`;
    };
    const tag = tagFor(c.vsMedian, c.baseVal, 'HOUSE median', 'mtag')
              + tagFor(c.vsMatch, c.matchVal_, 'match median', 'mtag-match');
    return `<div class="metric ${c.passFinal?'pass':'fail'}"><div class="mv">${c.val}</div><div class="mt">${c.label} /${c.target}</div>${tag}</div>`;
  }).join('');
}

function renderSingleCard(p, ev, showMatchTag){
  const badge = ev.applicable===0 ? '' :
    ev.fails===0 ? `<span class="fail-badge ok">ALL GREEN</span>` : `<span class="fail-badge bad">${ev.fails} RED</span>`;
  // inside a player group, the name is already shown once in the group header — repeating it
  // on every nested card is noise, so the opponent becomes the primary label instead
  const primaryLabel = showMatchTag ? `vs ${p.opp}` : p.name;
  return `<div class="player-card">
    <div class="pc-top">
      <span class="pc-name">${primaryLabel}</span>
      <span class="job-badge ${p.role}">${p.job}</span>
      ${badge}
    </div>
    <div class="metric-row">${renderMetricChips(ev)}</div>
  </div>`;
}

function renderPlayerList(){
  const matchVal = document.getElementById('matchFilter').value;
  const jobVal = document.getElementById('jobFilter').value;
  const sortVal = document.getElementById('sortFilter').value;
  const search = document.getElementById('searchBox').value.trim().toLowerCase();

  let rows = DASH.players.filter(p=>p.bf===currentBf);
  // drop roster slots with zero activity in this battlefield (e.g. assigned but didn't actually play) —
  // a 0/0/0/0 line isn't a real performance to judge, it's non-participation
  rows = rows.filter(p => (p.k + p.a + p.d + (p.mon||0) + (p.tab||0)) > 0);
  if(matchVal!=='all') rows = rows.filter(p=>String(p.match)===matchVal);
  if(jobVal!=='all') rows = rows.filter(p=>p.kpiJob===jobVal);
  if(search) rows = rows.filter(p=>p.name.toLowerCase().includes(search));

  const evaluated = rows.map(p=>({p, ev:evalPlayer(p)}));

  if(evaluated.length===0){
    document.getElementById('shownCount').textContent = 0;
    document.getElementById('passAllCount').textContent = 0;
    document.getElementById('playerList').innerHTML = `<div class="empty-msg">No players match these filters.</div>`;
    return;
  }

  // ---- specific match selected: flat list, one card per player, unchanged behavior ----
  if(matchVal !== 'all'){
    if(sortVal==='fail') evaluated.sort((a,b)=> b.ev.fails - a.ev.fails);
    else if(sortVal==='pass') evaluated.sort((a,b)=> a.ev.fails - b.ev.fails);
    else evaluated.sort((a,b)=> a.p.name.localeCompare(b.p.name));

    document.getElementById('shownCount').textContent = evaluated.length;
    document.getElementById('passAllCount').textContent = evaluated.filter(e=>e.ev.fails===0 && e.ev.applicable>0).length;
    document.getElementById('playerList').innerHTML = evaluated.map(({p,ev})=> renderSingleCard(p, ev, false)).join('');
    return;
  }

  // ---- "All matches": group by player, denominator is THEIR OWN match count, never the team total ----
  const groups = {};
  evaluated.forEach(e=>{
    const key = e.p.name;
    if(!groups[key]) groups[key] = [];
    groups[key].push(e);
  });

  const groupList = Object.entries(groups).map(([name, entries])=>{
    entries.sort((a,b)=> a.p.match - b.p.match); // chronological within a player
    const applicableEntries = entries.filter(e=>e.ev.applicable>0);
    const passedCount = applicableEntries.filter(e=>e.ev.fails===0).length;
    const totalFails = entries.reduce((s,e)=>s+e.ev.fails,0);
    const latestJob = entries[entries.length-1].p.job;
    const latestRole = entries[entries.length-1].p.role;
    return {name, entries, applicableEntries, passedCount, totalFails, latestJob, latestRole};
  });

  if(sortVal==='fail') groupList.sort((a,b)=> b.totalFails - a.totalFails);
  else if(sortVal==='pass') groupList.sort((a,b)=> a.totalFails - b.totalFails);
  else groupList.sort((a,b)=> a.name.localeCompare(b.name));

  document.getElementById('shownCount').textContent = groupList.length + ' players';
  document.getElementById('passAllCount').textContent = groupList.filter(g=> g.applicableEntries.length>0 && g.passedCount===g.applicableEntries.length).length;

  document.getElementById('playerList').innerHTML = groupList.map(g=>{
    const n = g.entries.length;
    const rateClass = g.applicableEntries.length===0 ? '' : (g.passedCount===g.applicableEntries.length ? 'good' : (g.passedCount===0 ? 'bad' : ''));
    const rateLabel = g.applicableEntries.length===0 ? '' :
      `<span class="pg-rate ${rateClass}">${g.passedCount}/${g.applicableEntries.length} passed</span>`;
    const cardsHtml = g.entries.map(({p,ev})=> renderSingleCard(p, ev, true)).join('');
    return `<div class="player-group">
      <div class="player-group-head">
        <span class="pg-name">${g.name}</span>
        <span class="job-badge ${g.latestRole}">${g.latestJob}</span>
        <span class="pg-count">${n} match${n>1?'es':''} played</span>
        ${rateLabel}
      </div>
      ${cardsHtml}
    </div>`;
  }).join('');
}

// ---------- Team Composition ----------
const COMP_JOBS = ['Sniper/Stalker/GS','Doram','Mage','LK/Paladin','Biochemist','Bard/Gypsy','Priest'];

function buildComposition(bf, matchNo){
  const active = p => (p.k+p.a+p.d+(p.mon||0)+(p.tab||0))>0;
  const countBy = arr => {
    const c = {}; COMP_JOBS.forEach(j=>c[j]=0);
    arr.filter(p=>p.bf===bf && p.match===matchNo && active(p)).forEach(p=>{
      if(c[p.kpiJob]!==undefined) c[p.kpiJob]++;
    });
    return c;
  };
  return { house: countBy(DASH.players), opp: countBy(DASH.opponents || []) };
}

function renderComposition(){
  const sel = document.getElementById('compMatchFilter');
  if(sel.options.length===0){
    sel.innerHTML = DASH.matches.map(m=>`<option value="${m.match}">M${m.match} vs ${m.opp} (${m.result})</option>`).join('');
    sel.value = DASH.matches[0].match; // default to M1
  }
  const matchNo = parseInt(sel.value, 10);
  const comp = buildComposition(currentBf, matchNo);
  const rows = COMP_JOBS.map(job=>{
    const h = comp.house[job], o = comp.opp[job], total = h+o;
    const oppLeads = o > h; // the actual flag driving the highlight — everything else is just styling
    const barInner = total===0
      ? `<div class="empty-both">nobody fielded this job</div>`
      : `<div class="house" style="flex:${h}"></div><div class="opp" style="flex:${o}"></div>`;
    return `<div class="comp-row${oppLeads ? ' opp-lead' : ''}">
      <div class="comp-head">
        <span class="job">${job}</span>
        <span class="counts"><b>${h}</b> HOUSE &nbsp;·&nbsp; <b class="opp-num">${o}</b> Opponent</span>
      </div>
      <div class="comp-bar">${barInner}</div>
    </div>`;
  }).join('');
  document.getElementById('compGrid').innerHTML =
    `<div class="comp-legend"><span><i class="dot house"></i>HOUSE</span><span><i class="dot opp"></i>Opponent</span></div>${rows}`;
}

// ---------- Top Performers leaderboard ----------
// Total across all matches, HOUSE roster only (DASH.opponents is never touched here), same
// "active" filter as everywhere else (a 0/0/0/0 line is a roster slot that didn't play).
// Chosen deliberately as TOTAL, not per-match average: this rewards whoever contributed the
// most across the season, so a player who suited up for every match naturally outranks a
// single-match substitute with a flashier one-off game. Ties break alphabetically by name.
function buildLeaderboard(bf){
  const MIN_LB_MATCHES = 2; // must have played at least this many matches on this battlefield to be ranked
  const rows = DASH.players.filter(p=>p.bf===bf && (p.k+p.a+p.d+(p.mon||0)+(p.tab||0))>0);
  const byPlayer = {};
  rows.forEach(p=>{ (byPlayer[p.name] = byPlayer[p.name] || []).push(p); });
  const objKey = bf==='Sub' ? 'mon' : 'tab';
  // A single easy match makes "0 deaths" trivial to reach by luck, not consistency — 0 across 4
  // is a real record. Kills/Assist/Tablet/Monster are TOTALS, which already need volume to rank
  // high, so this floor rarely changes those; it exists mainly to keep Fewest Deaths honest.
  const entries = Object.values(byPlayer)
    .filter(ps=>ps.length>=MIN_LB_MATCHES)
    .map(ps=>{
      ps.sort((a,b)=>a.match-b.match);
      const latest = ps[ps.length-1]; // most recent job/role, in case it changed match to match
      const sum = key => ps.reduce((s,p)=>s+(p[key]||0), 0);
      return {name:latest.name, job:latest.job, n:ps.length,
              k:sum('k'), a:sum('a'), d:sum('d'), obj:sum(objKey)};
    });
  // Tie-break: when the primary stat is equal, rank by Assist total instead — a real signal of
  // overall contribution rather than an arbitrary alphabetical cut. The Most Assists panel can't
  // tie-break on itself, so it falls back to Kills; alphabetical is the last-resort tie-break only
  // for the (very rare) case where even that secondary stat is also identical.
  const topN = (key, dir) => {
    const secondary = key==='a' ? 'k' : 'a';
    return [...entries]
      .sort((x,y)=> {
        const primary = dir==='desc' ? y[key]-x[key] : x[key]-y[key];
        if(primary!==0) return primary;
        const sec = y[secondary]-x[secondary]; // higher secondary always wins, regardless of primary's direction
        if(sec!==0) return sec;
        return x.name.localeCompare(y.name);
      })
      .slice(0,10); // top 3 render open by default; ranks 4-10 sit behind a "show more" toggle
  };
  return {
    kills:  topN('k','desc'),
    assist: topN('a','desc'),
    death:  topN('d','asc'),
    obj:    topN('obj','desc'),
    objLabel: bf==='Sub' ? 'Most Monsters' : 'Most Tablets',
  };
}

function renderLbPanel(title, list, key, panelId){
  if(list.length===0) return `<div class="lb-panel"><div class="lb-title">${title}</div><div class="lb-empty">No data yet.</div></div>`;
  const MEDAL = ['🏆','🥈','🥉']; // rank badge already carries the number, so this is flair on the name, not the only cue
  const rowHtml = (e,i) => `
    <div class="lb-row">
      <div class="lb-rank r${i<3 ? i+1 : ''}">${i+1}</div>
      <div class="lb-info">
        <div class="lb-name">${MEDAL[i] || ''} ${e.name}</div>
        <div class="lb-meta">${e.n} match${e.n>1?'es':''}</div>
      </div>
      <div class="lb-value">${e[key]}</div>
    </div>`;
  const top3 = list.slice(0,3).map(rowHtml).join('');
  const rest = list.slice(3);
  let tail = '';
  if(rest.length>0){
    const restRows = rest.map((e,i)=>rowHtml(e,i+3)).join('');
    tail = `<div class="lb-extra" id="lb-extra-${panelId}" style="display:none;">${restRows}</div>
      <button class="lb-toggle" id="lb-toggle-${panelId}" onclick="toggleLbExtra('${panelId}')">Show ${rest.length} more ▾</button>`;
  }
  return `<div class="lb-panel"><div class="lb-title">${title}</div>${top3}${tail}</div>`;
}

function toggleLbExtra(panelId){
  const extra = document.getElementById('lb-extra-'+panelId);
  const btn = document.getElementById('lb-toggle-'+panelId);
  const nowHidden = extra.style.display !== 'none';
  extra.style.display = nowHidden ? 'none' : 'block';
  btn.textContent = nowHidden ? `Show ${extra.children.length} more ▾` : 'Show less ▴';
}

function renderLeaderboard(){
  const lb = buildLeaderboard(currentBf);
  document.getElementById('lbGrid').innerHTML =
    renderLbPanel('Most Kills', lb.kills, 'k', 'kills') +
    renderLbPanel('Most Assists', lb.assist, 'a', 'assist') +
    renderLbPanel('Fewest Deaths', lb.death, 'd', 'death') +
    renderLbPanel(lb.objLabel, lb.obj, 'obj', 'obj');
}

// ---------- KPI info panel (built from the same KPI object used for pass/fail) ----------
function renderKpiInfoPanel(){
  const table = KPI[currentBf];
  const baseline = HOUSE_BASELINE[currentBf];
  const monLabel = currentBf === 'Sub' ? 'Monster' : 'Tablet';

  // ---- third table: the currently-selected match's own per-job medians ----
  const matchSel = document.getElementById('matchFilter');
  const matchVal = matchSel ? matchSel.value : 'all';
  let matchSectionHtml;
  if(matchVal === 'all'){
    matchSectionHtml = `<p style="margin-top:12px;"><b class="ip-title ip-blue">This match's median</b>Pick a specific match below (instead of "All matches") to see that match's own per-job median here — it's different every match, so there's nothing to show while "All matches" is selected.</p>`;
  } else {
    const matchInfo = DASH.matches.find(m => String(m.match) === matchVal);
    const matchLabel = matchInfo ? `M${matchInfo.match} vs ${matchInfo.opp} (${matchInfo.result})` : `Match ${matchVal}`;
    const matchRows = Object.entries(table).map(([job, t])=>{
      const mm = MATCH_MEDIANS[`${currentBf}|${matchVal}|${job}`];
      const cellClass = (mv, tv, ceil) => {
        if(!COLOR_MATCH_MEDIAN_TABLE) return '';
        if(mv===null || mv===undefined || tv===null) return 'bi-na';
        return (ceil ? mv<=tv : mv>=tv) ? 'bi-ok' : 'bi-short';
      };
      const fmtVal = v => v===null || v===undefined ? '—' : Math.round(v*10)/10;
      // A null KPI target means this metric isn't tracked for this job at all (e.g. Kills for
      // Priest) — that always wins over showing a computed number, even a real "0", matching how
      // the two tables above already hide it. Insufficient sample size is the separate, second
      // reason a cell can read "—": the job/metric IS tracked, there just weren't enough players.
      const cell = (mv, tv, ceil) => tv===null ? `<td class="bi-na">—</td>` : `<td class="${cellClass(mv,tv,ceil)}">${fmtVal(mv)}</td>`;
      if(!mm) return `<tr><td>${job}</td>${cell(null,t.mon,false)}${cell(null,t.k,false)}${cell(null,t.a,false)}${cell(null,t.d,true)}</tr>`;
      return `<tr>
        <td>${job}</td>
        ${cell(mm.mon,t.mon,false)}
        ${cell(mm.k,t.k,false)}
        ${cell(mm.a,t.a,false)}
        ${cell(mm.d,t.d,true)}
      </tr>`;
    }).join('');
    const colourNote = COLOR_MATCH_MEDIAN_TABLE
      ? ` Colour here means the same thing as the table above, but for the group rather than for HOUSE overall: <span class="bi-short-dot">●</span> red = everyone in that job fell short of the target this match, <span class="bi-ok-dot">●</span> green = the group cleared it.`
      : '';
    matchSectionHtml = `
      <p style="margin-top:12px;"><b class="ip-title ip-blue">This match's median — ${matchLabel}</b>Everyone who played that job in this one match — HOUSE and the opposing guild pooled together — averaged into a single number. A blank cell just means fewer than ${MIN_MATCH_MEDIAN_N} players shared that job that match, too few to mean anything.${colourNote}</p>
      <table>
        <thead><tr><th>Job</th><th>${monLabel}</th><th>Kills</th><th>Assist</th><th>Death</th></tr></thead>
        <tbody>${matchRows}</tbody>
      </table>`;
  }

  const rows = Object.entries(table).map(([job, t])=>{
    const cell = (v, ceil) => v===null ? '—' : (ceil ? `≤ ${v}` : `≥ ${v}`);
    return `<tr>
      <td>${job}</td>
      <td>${cell(t.mon,false)}</td>
      <td>${cell(t.k,false)}</td>
      <td>${cell(t.a,false)}</td>
      <td>${cell(t.d,true)}</td>
    </tr>`;
  }).join('');

  const baselineRows = Object.entries(table).map(([job, t])=>{
    const b = baseline[job];
    const cellClass = (bv, tv, ceil) => {
      if(bv===null || tv===null) return 'bi-na';
      const clears = ceil ? bv<=tv : bv>=tv;
      return clears ? 'bi-ok' : 'bi-short';
    };
    const cellText = (bv) => bv===null ? '—' : bv;
    return `<tr>
      <td>${job}</td>
      <td class="${cellClass(b.mon,t.mon,false)}">${cellText(b.mon)}</td>
      <td class="${cellClass(b.k,t.k,false)}">${cellText(b.k)}</td>
      <td class="${cellClass(b.a,t.a,false)}">${cellText(b.a)}</td>
      <td class="${cellClass(b.d,t.d,true)}">${cellText(b.d)}</td>
    </tr>`;
  }).join('');

  document.getElementById('kpiInfoPanel').innerHTML = `
    <p><b class="ip-title ip-gold">${currentBf}-Battlefield thresholds</b>This is the bar winning rosters actually clear. For each job, every winning roster's median gets taken, then the median of those medians — so one roster stacked with a job, or one blowout win, can't skew the number by itself. ${monLabel}, Kills, and Assist are minimums to hit. Death is a maximum — go over it and that's a miss. Some jobs don't get a Kills target (Priests, for one); they're only graded on the columns that actually apply to them.</p>
    <p><b class="ip-title ip-win">How a chip turns green</b>There are two ways in. Clear the target below, and you're green. Miss it, and you can still turn green by beating <i>both</i> tags shown on the chip — the <span style="color:var(--gold-dim);font-weight:700;">HOUSE median</span> tag and the <span style="color:var(--dps);font-weight:700;">match median</span> tag (a tie on either still counts).</p>
    <table>
      <thead><tr><th>Job</th><th>${monLabel}</th><th>Kills</th><th>Assist</th><th>Death</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <p style="margin-top:12px;"><b class="ip-title ip-teal">Where HOUSE actually sits</b>This is what HOUSE actually does — win or lose, across all matches. Same jobs, same columns as the table above, so you can line them up directly. <span class="bi-short-dot">●</span> red means HOUSE falls short of that target; <span class="bi-ok-dot">●</span> green means HOUSE meets or beats it.</p>
    <table>
      <thead><tr><th>Job</th><th>${monLabel}</th><th>Kills</th><th>Assist</th><th>Death</th></tr></thead>
      <tbody>${baselineRows}</tbody>
    </table>
    ${matchSectionHtml}
    <p style="margin-top:12px;"><b class="ip-title ip-purple">The two tags</b></p>
    <ul style="margin:2px 0 0 18px; padding:0; font-size:11.5px; color:var(--text-dim); line-height:1.6;">
      <li><b style="color:var(--gold-dim);">Gold</b> — vs HOUSE's own typical output, fixed across all matches.</li>
      <li><b style="color:var(--dps);">Blue</b> — vs everyone who played your job in that match, both sides. Needs ${MIN_MATCH_MEDIAN_N}+ players sharing it, else blank.</li>
    </ul>`;
}

document.getElementById('kpiInfoToggle').addEventListener('click', ()=>{
  const panel = document.getElementById('kpiInfoPanel');
  const open = panel.style.display !== 'none';
  panel.style.display = open ? 'none' : 'block';
  document.getElementById('kpiInfoToggle').textContent = open ? 'ℹ️ How is this calculated?' : '✕ Hide details';
  if(!open) renderKpiInfoPanel();
});

// ---------- wiring ----------
function setupToggle(id, onChange){
  const el = document.getElementById(id);
  el.querySelectorAll('button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      el.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      onChange(btn.dataset.bf);
    });
  });
}

let listenersWired = false;
function setupListeners(){
  if(listenersWired) return;
  listenersWired = true;
  // ONE toggle now (under Team Trends) drives all three sections — Trends, Top Performers, and
  // Player KPI Check. setupToggle already handles this element's own active-button styling on
  // click; this handler just updates the shared state and re-renders everything downstream of it.
  const onBfChange = (bf)=>{
    currentBf = bf;
    renderTrendCharts();
    renderComposition();
    renderLeaderboard();
    renderPlayerList();
    if(document.getElementById('kpiInfoPanel').style.display !== 'none') renderKpiInfoPanel();
  };
  setupToggle('trendBfToggle', onBfChange);
  document.getElementById('compMatchFilter').addEventListener('change', renderComposition);
  ['matchFilter','jobFilter','sortFilter'].forEach(id=>{
    document.getElementById(id).addEventListener('change', ()=>{
      renderPlayerList();
      // the info panel's third table is specific to the selected match, so it has to follow the filter
      if(document.getElementById('kpiInfoPanel').style.display !== 'none') renderKpiInfoPanel();
      // reflect this section's own choice back onto the match strip, but don't push it onto
      // Team Composition — only an actual card click does that two-way jump
      if(id==='matchFilter'){
        const v = document.getElementById('matchFilter').value;
        document.querySelectorAll('#matchStrip .match-card').forEach(card=>{
          card.classList.toggle('selected', v!=='all' && parseInt(card.dataset.match,10)===parseInt(v,10));
        });
      }
    });
  });
  document.getElementById('searchBox').addEventListener('input', renderPlayerList);
}

function initApp(){
  setupListeners();
  buildMatchMedians();
  renderMatchStrip();
  renderComposition();
  renderTrendCharts();
  renderLeaderboard();
  populateFilters();
  renderPlayerList();
}

// ---------- data: embedded snapshot renders instantly, sheet sync upgrades it ----------
let DASH;
function showFatalError(err){
  const msg = (err && err.message) ? err.message : String(err);
  document.body.innerHTML = `
    <div style="max-width:560px;margin:60px auto;padding:24px 20px;background:#171a21;border:1px solid #2a2f3a;
                border-radius:14px;color:#e8e8ec;font-family:-apple-system,sans-serif;text-align:left;">
      <div style="font-size:26px;margin-bottom:8px;">⚠️</div>
      <h2 style="font-size:16px;margin:0 0 8px;">This file didn't load correctly</h2>
      <p style="font-size:12.5px;color:#8b8f9c;line-height:1.6;margin:0 0 10px;">
        The dashboard's own startup code hit an error before it could render anything \u2014 this usually means
        the file got altered in transit (some chat apps re-encode attachments) rather than a data problem.
      </p>
      <p style="font-size:11px;background:#1e222b;padding:8px 10px;border-radius:8px;color:#e2645f;font-family:monospace;word-break:break-word;">
        ${msg}
      </p>
      <p style="font-size:12.5px;color:#8b8f9c;line-height:1.6;">
        Try: re-downloading the original file instead of a forwarded copy, or opening it in a different browser app.
        If it still fails, screenshot this exact message \u2014 it tells us precisely what broke.
      </p>
    </div>`;
}

try{
  DASH = DASH_SNAPSHOT;
}catch(err){
  showFatalError(err);
  throw err; // stop here — nothing below can safely run without DASH
}

// render everything from the embedded snapshot — self-contained, no network dependency
try{
  initApp();
}catch(err){
  showFatalError(err);
}

</script>
